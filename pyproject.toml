[project]
name = "t2voice"
version = "0.1.0"
description = "Windows desktop novel reader with edge-tts listening"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "edge-tts>=6.1",
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
]

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
